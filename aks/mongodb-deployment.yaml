# -----------------------------
# API VERSION
# -----------------------------

apiVersion: apps/v1
# Every Kubernetes object belongs to an API group and version.
# Think of this as telling Kubernetes:
# "I'm creating a Deployment using the apps API version 1."
#
# Different resources use different API versions.
# For example:
# Pods       -> apiVersion: v1
# Services   -> apiVersion: v1
# Deployments-> apiVersion: apps/v1


# -----------------------------
# RESOURCE TYPE
# -----------------------------

kind: Deployment
# Specifies what type of Kubernetes resource this YAML creates.
#
# Deployment DOES NOT run containers directly.
# Instead, it manages Pods for you.
#
# It automatically:
# - Creates Pods
# - Restarts Pods if they crash
# - Keeps the desired number of Pods running
# - Performs rolling updates
# - Allows rollbacks


# -----------------------------
# METADATA
# -----------------------------

metadata:

  name: mongodb-deployment
  # The unique name of this Deployment.
  #
  # Kubernetes uses this name to identify the Deployment.
  #
  # Example:
  # kubectl get deployments
  #
  # Output:
  # mongodb-deployment


  namespace: ecommerce-namespace
  # Namespaces divide a Kubernetes cluster into separate logical areas.
  #
  # Imagine one Kubernetes cluster shared by several teams:
  #
  # Team A
  #   ecommerce-namespace
  #
  # Team B
  #   testing-namespace
  #
  # Team C
  #   production-namespace
  #
  # Resources inside one namespace are isolated from resources
  # in another namespace unless explicitly configured.


  labels:
    app: mongodb
    # Labels are simple key-value pairs attached to resources.
    #
    # Think of labels as "tags" or "categories."
    #
    # Example:
    # app: mongodb
    #
    # This tells Kubernetes:
    # "This Deployment belongs to the MongoDB application."
    #
    # Labels are mainly used for:
    # - Selecting resources
    # - Grouping resources
    # - Services finding Pods
    # - Deployments managing Pods


# -----------------------------
# DESIRED STATE
# -----------------------------

spec:
# The spec section describes the desired state.
#
# Instead of saying:
# "Create one Pod now."
#
# You tell Kubernetes:
# "I always want one MongoDB Pod running."
#
# Kubernetes continuously checks whether reality matches
# your desired state.


  replicas: 1
  # The number of Pod copies Kubernetes should keep running.
  #
  # replicas: 1
  #
  # Deployment
  #      │
  #      ▼
  #    Pod 1
  #
  # If Pod 1 crashes...
  #
  # Deployment
  #      │
  #      ▼
  # Creates another Pod automatically.
  #
  # If you change this to:
  #
  # replicas: 3
  #
  # Deployment
  #      │
  #      ├── Pod 1
  #      ├── Pod 2
  #      └── Pod 3
  #
  # Kubernetes ensures exactly three Pods are always running.


# -----------------------------
# POD SELECTION
# -----------------------------

  selector:
  # The selector tells the Deployment:
  #
  # "Which Pods belong to me?"
  #
  # The Deployment only manages Pods whose labels match
  # this selector.


    matchLabels:
    # matchLabels means:
    #
    # "Find Pods that contain ALL these labels."


      app: mongodb
      # The Deployment looks for Pods with:
      #
      # app=mongodb
      #
      # Any Pod that has this label is considered part
      # of this Deployment.
      #
      # IMPORTANT:
      # This MUST match the Pod template labels below.
      #
      # Otherwise the Deployment will not recognize
      # the Pods it creates.


# -----------------------------
# POD TEMPLATE
# -----------------------------

  template:
  # The template is a blueprint for creating Pods.
  #
  # The Deployment uses this template every time it needs
  # to create a new Pod.
  #
  # Example:
  #
  # Pod crashes
  #      │
  #      ▼
  # Deployment
  #      │
  # Uses this template
  #      │
  # Creates a new Pod


    metadata:

      labels:
        app: mongodb
        # These labels are attached directly to each Pod.
        #
        # Every Pod created from this template will have:
        #
        # app=mongodb
        #
        # This matches the selector above.
        #
        # selector:
        #   app=mongodb
        #
        # template labels:
        #   app=mongodb
        #
        # Because they match,
        # the Deployment knows these Pods belong to it.


# -----------------------------
# POD SPECIFICATION
# -----------------------------

    spec:
    # This section describes what the Pod should contain.
    #
    # A Pod can run:
    # - One container
    # - Multiple containers
    #
    # In this case,
    # only one MongoDB container runs.


      containers:
      # A list of containers inside this Pod.
      #
      # Even though only one container exists,
      # Kubernetes expects a list because Pods can contain
      # multiple containers.


      - name: mongodb
        # Friendly name of this container.
        #
        # This is NOT the image name.
        #
        # It simply identifies the container inside the Pod.
        #
        # Example:
        # kubectl describe pod <pod-name>


        image: nawonecommerceregistry.azurecr.io/ecommerce-mongodb:latest
        # The Docker image Kubernetes should download
        # and run.
        #
        # Breakdown:
        #
        # nawonecommerceregistry.azurecr.io
        #   ↓
        # Azure Container Registry
        #
        # ecommerce-mongodb
        #   ↓
        # Repository name
        #
        # latest
        #   ↓
        # Image tag (version)
        #
        # Kubernetes asks the container runtime:
        #
        # "Pull this image if it doesn't already exist."
        #
        # Then it starts a container from that image.


        ports:
        # Documents which ports this container listens on.
        #
        # This DOES NOT expose MongoDB outside the Pod.
        #
        # It simply tells Kubernetes:
        #
        # "The application inside the container is
        # listening on these ports."
        #
        # To allow other Pods or external users to connect,
        # you still need a Kubernetes Service.


        - containerPort: 27017
          # MongoDB listens on TCP port 27017.
          #
          # Clients connect to MongoDB through this port.
          #
          # Example:
          #
          # ASP.NET API
          #        │
          #        ▼
          # MongoDB Service
          #        │
          #        ▼
          # MongoDB Pod
          #        │
          #        ▼
          # Container Port 27017