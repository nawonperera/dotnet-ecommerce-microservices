trigger:
  branches:
    include:
      - dev
      - qa
      - uat
      - staging
      - production

resources:
- repo: self

variables:
  - name: dockerRegistryServiceConnection
    value: 'fb67587d-6211-425e-ba68-7261394b0a1c'
  - name: imageRepository
    value: 'products-microservice'
  - name: containerRegistry
    value: 'nawonecommerceregistry.azurecr.io'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/ProductsMicroServiceAPI/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'
  - name: linuxImageName
    value: 'ubuntu-latest'
  - name: windowsImageName
    value: 'windows-latest'
  - name: aksClusterName
    value: 'ecommerce-aks-cluster'
  - name: devAksServiceConnectionName
    value: 'dev-ecommerce-aks-cluster-dev-1728475525366'
  - name: qaAksServiceConnectionName
    value: 'qa-ecommerce-aks-cluster-qa-1728475982025'
  - name: uatAksServiceConnectionName
    value: 'uat-ecommerce-aks-cluster-uat-1728475742545'
  - name: stagingAksServiceConnectionName
    value: 'staging-ecommerce-aks-cluster-staging-1728475932481'
  - name: productionAksServiceConnectionName
    value: 'production-ecommerce-aks-cluster-production-1728475483682'
  - name: resourceGroupServiceConnectionName
    value: 'ecommerce-resource-group-connection'
  - name: keyVaultName
    value: 'products-pipeline-kv'

stages:
- stage: InitializeKeyVault
  displayName: Initialize Key Vault Secrets
  jobs:
  - job: FetchSecrets
    displayName: Fetch Key Vault Secrets
    pool:
      vmImage: '$(linuxImageName)'
    steps:
      - task: AzureKeyVault@2
        displayName: Fetch Key Vault Secrets
        inputs:
          azureSubscription: $(resourceGroupServiceConnectionName)
          keyVaultName: '$(keyVaultName)'
          SecretsFilter: '*'
          RunAsPreJob: true

- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Docker Build
    pool:
      vmImage: $(linuxImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest
        buildContext: $(Build.SourcesDirectory)

- stage: Test
  displayName: Test and Publish results stage
  jobs:
    - job: RunTest
      displayName: Run Unit Tests
      pool:
        vmImage: $(windowsImageName)
      steps:
        - checkout: self
          displayName: Checkout source code
      
        - task: NuGetToolInstaller@1
          displayName: Install NuGetTool
        
        - task: DotNetCoreCLI@2
          displayName: Restore NuGet Packages
          inputs:
            command: 'restore'
            projects: '**/eCommerceSolution.ProductsService.slnx'

        - task: DotNetCoreCLI@2
          displayName: Build Solution
          inputs:
            command: 'build'
            projects: '**/eCommerceSolution.ProductsService.slnx'
            arguments: '--configuration Debug'
            configuration: 'debug'

        - task: DotNetCoreCLI@2
          displayName: Run Unit Tests
          inputs:
            command: 'test'
            projects: '**/eCommerceSolution.ProductsService.slnx'
            arguments: '--configuration Release --collect:"Code Coverage"'
            publishTestResults: true

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Test
  condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  variables:
  - group: products-microservice-dev
  jobs:
  - deployment: DeploymentToDev
    displayName: Deployment to Dev Environment
    environment: dev
    strategy:
      runOnce:
        deploy:
            steps:
            - checkout: self
              displayName: Checkout source code
        
            - script: |
                echo "Listing contents of k8s"
                ls -l $(Build.SourcesDirectory)/k8s/dev
              displayName:  'List Files in k8s/dev Directory'

            - script: |
                find $(Build.SourcesDirectory)/k8s/dev -type f \( -name "*.yaml" -o -name "*.yml" \) -exec sed -i 's/__TAG__/$(tag)/g' {} +
              displayName: 'Replace image tag in all deployment files'

            - task: Kubernetes@1
              displayName: Deploy to dev namespace in kubernetes
              inputs:
                kubernetesServiceEndpoint: $(devAksServiceConnectionName)
                kubernetesCluster: $(aksClusterName)
                namespace: $(kubernetes-namespace)
                command: apply
                arguments: '-f $(Build.SourcesDirectory)/k8s/dev/.'

